name: Build and Test on PR
on:
  push:
  pull_request:
    branches: master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Allow multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Options: https://github.com/docker/build-push-action
      # Note: uses the Git reference as context, so file mutations prior are ignored
      - name: Build the `test` target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: false
          target: test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
