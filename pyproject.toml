[project]
name = "transcription_bot"
version = "0.1.0"
description = "Whisper-based Telegram transcription bot"
authors = [
    { name = "extrange", email = "29305375+extrange@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.15"

dependencies = [
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "uvloop>=0.23.0",
    "hachoir>=3.3.0",
    "pysubs2>=1.7.3",
    "replicate>=0.31.0",
    "humanize>=4.10.0",
    "minio>=7.2.7",
    "telethon>=1.36.0",
    "openai>=1.41.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pyright>=1.1.375",
    "ruff>=0.5.7",
    "pytest>=8.3.2",
    "pytest-cov>=7.1.0",
    "coverage>=7.6.1",
    "pytest-asyncio>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_bot"]

[tool.pyright]
# pre-commit: make pyright use the venv
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# https://docs.pytest.org/en/latest/explanation/goodpractices.html#which-import-mode
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "integration: needs a running MinIO instance (set the MINIO_* environment variables)",
]
